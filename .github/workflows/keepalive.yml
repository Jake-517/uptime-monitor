name: Keepalive

# GitHub silently disables scheduled workflows in repos with no commit activity
# for 60 days. This monthly no-op commit keeps the uptime monitor alive forever.

on:
  schedule:
    - cron: '17 9 1 * *'   # once a month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date > .last-keepalive
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git add .last-keepalive
          git commit -m "keepalive: $(date +%F)" || exit 0
          git push
